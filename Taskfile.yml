# https://taskfile.dev/docs/guide
# https://taskfile.dev/reference/templating/
version: '3'
tasks:
  default: |
    # go test -v ./...
    go test ./...

  run: |
    go run cmd/server/main.go 
    # http://admin.lab:8080

  cli: |
    go run cmd/client/main.go
    
  b: |
    go build -o bin/server ./cmd/server
    go build -o bin/client ./cmd/client

  rel: |
    task gen
    task b
    lctl reup lab.gater
    
  rel.snapshot: |
    goreleaser release --snapshot --clean

  gen: |
    go generate ./...

  asset.clean: |
    rm -fr web/dist

  asset.setup: |
    bun add -d tailwindcss @tailwindcss/cli daisyui alpinejs

  setup: |
    # go mod init gater
    go mod tidy
  